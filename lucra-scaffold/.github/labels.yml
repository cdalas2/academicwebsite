# Lucra GitHub Labels
# Apply with: gh label import .github/labels.yml
# (requires gh CLI: https://cli.github.com)

# ── Type labels ──────────────────────────────────────────────────────────────
- name: "type: feature"
  color: "0075ca"
  description: "New feature or user story"

- name: "type: bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "type: hotfix"
  color: "e4e669"
  description: "Urgent fix for a production issue"

- name: "type: release"
  color: "0e8a16"
  description: "Release preparation work"

- name: "type: chore"
  color: "e4e4e4"
  description: "Build process, tooling, or dependency updates"

- name: "type: docs"
  color: "b0d4f8"
  description: "Documentation changes only"

- name: "type: refactor"
  color: "d4c5f9"
  description: "Code change that neither fixes a bug nor adds a feature"

- name: "type: test"
  color: "bfd4f2"
  description: "Adding or improving tests"

# ── Scope labels ─────────────────────────────────────────────────────────────
- name: "scope: desktop"
  color: "f4a261"
  description: "Desktop application"

- name: "scope: mobile"
  color: "e76f51"
  description: "Mobile companion app"

- name: "scope: parser"
  color: "2a9d8f"
  description: "Document parsing subsystem"

- name: "scope: storage"
  color: "264653"
  description: "Local SQLite storage layer"

- name: "scope: anonymizer"
  color: "457b9d"
  description: "Data anonymization engine"

- name: "scope: cashback"
  color: "a8dadc"
  description: "Credit card cash back optimizer"

- name: "scope: sync"
  color: "6d6875"
  description: "Desktop-to-mobile sync protocol"

- name: "scope: shared"
  color: "c77dff"
  description: "Shared types and schemas"

# ── Priority labels ───────────────────────────────────────────────────────────
- name: "priority: critical"
  color: "b91c1c"
  description: "Blocking — must be resolved immediately"

- name: "priority: high"
  color: "f97316"
  description: "Should be resolved in the current sprint"

- name: "priority: medium"
  color: "facc15"
  description: "Should be resolved in the next sprint"

- name: "priority: low"
  color: "86efac"
  description: "Nice to have, no immediate urgency"

# ── Status labels ─────────────────────────────────────────────────────────────
- name: "status: in progress"
  color: "1d4ed8"
  description: "Actively being worked on"

- name: "status: blocked"
  color: "7f1d1d"
  description: "Cannot proceed — waiting on something"

- name: "status: needs review"
  color: "7c3aed"
  description: "PR or issue needs a reviewer"

- name: "status: on hold"
  color: "9ca3af"
  description: "Intentionally paused"

# ── Gitflow branch labels ─────────────────────────────────────────────────────
- name: "branch: feature"
  color: "93c5fd"
  description: "PR originates from a feature/* branch"

- name: "branch: release"
  color: "6ee7b7"
  description: "PR originates from a release/* branch"

- name: "branch: hotfix"
  color: "fcd34d"
  description: "PR originates from a hotfix/* branch"
